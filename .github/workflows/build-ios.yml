name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Verify iOS app configuration
        run: |
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'UIInterfaceOrientationPortrait' ios/Runner/Info.plist
          ! grep -q 'UIInterfaceOrientationLandscape' ios/Runner/Info.plist

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          rm -rf Payload yomiru-ios-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry yomiru-ios-unsigned.ipa Payload
          ls -lh yomiru-ios-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: yomiru-ios-unsigned-${{ github.sha }}
          path: yomiru-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
