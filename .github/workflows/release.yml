name: Release Android APK and iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.2'
        required: true
        default: v1.0.2

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Prepare Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/yomiru-release.jks
            store_password="$KEYSTORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_password="$KEY_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured; generating an ephemeral signing key for this release."
            store_password="$(openssl rand -hex 16)"
            key_alias="yomiru-release"
            key_password="$store_password"
            keytool -genkeypair -v               -keystore android/app/yomiru-release.jks               -storepass "$store_password"               -keypass "$key_password"               -alias "$key_alias"               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Yomiru, OU=Release, O=Yutro, L=Unknown, ST=Unknown, C=XX"
          fi

          cat > android/key.properties <<EOF
          storePassword=$store_password
          keyPassword=$key_password
          keyAlias=$key_alias
          storeFile=yomiru-release.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "yomiru-android-$RELEASE_TAG.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: yomiru-android-${{ env.RELEASE_TAG }}
          path: yomiru-android-${{ env.RELEASE_TAG }}.apk
          if-no-files-found: error
          retention-days: 90

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Verify iOS app configuration
        run: |
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          grep -q 'ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'UIInterfaceOrientationPortrait' ios/Runner/Info.plist
          grep -q 'UIInterfaceOrientationLandscapeLeft' ios/Runner/Info.plist
          grep -q 'UIInterfaceOrientationLandscapeRight' ios/Runner/Info.plist

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "yomiru-ios-$RELEASE_TAG-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: yomiru-ios-${{ env.RELEASE_TAG }}
          path: yomiru-ios-${{ env.RELEASE_TAG }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: yomiru-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "$RELEASE_TAG" dist/*             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Yomiru $RELEASE_TAG"             --notes "Android release APK and iOS unsigned IPA. Configure the Android signing Secrets for a persistent production signing key; without them, the workflow uses a temporary test key. The iOS IPA must be signed with Apple Developer credentials before device installation."
